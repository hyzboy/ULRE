# AssetGen 配置 —— 只登记「分组与产物位置」，绝不描述字段/布局。
#
# 字段清单、类型、顺序、偏移、类内缺省值全部由 Clang AST 与记录布局推导；
# 这里唯一的人工信息是「输出到哪个文件、属于哪个命名空间」。
#
# `scan` 的每一项可以是**目录**（递归扫描）也可以是**单个头文件**。按文件切分
# 是为了让同一个目录里的不同资产规约落到不同分组，生成文件不至于混在一起。

# 外部定义的枚举（来自第三方头，例如 Vulkan）。按整数序列化，不生成名字表。
# `ShaderStage` 是 VK 位标志的组合值（Mesh|Fragment 这类），逐值拼写表无从枚举，
# 磁盘上也只按原始整数走。
integer_enums = ["VkFormat", "ShaderStage"]

# ── 枚举的 TOML 拼写别名（可选）─────────────────────────────────────────────
# 按**枚举值声明顺序**给出别名：解析时别名与 C++ 名都接受（大小写不敏感），
# 写出时优先用别名。这样既不改动已有的 TOML 拼写，也不用修改 C++ 命名。
[[enum]]
name = "SceneMaterialType"
aliases = ["PBRSurface", "EmissiveSurface", "TransmissionSurface"]

[[enum]]
name = "SceneCameraMode"
aliases = ["view_model", "free", "look_at", "first_person"]

# ── 外部枚举：拼写表已有唯一真源，生成器只转发 ──────────────────────────────
# Vulkan 三枚举的名字↔值真源是 `inc/hgl/mtl/VkEnumText.h`（去前缀 CamelCase、
# 精确匹配）。材质 TOML 的历史拼写完全由那张表决定，所以这里只声明「去哪转发」，
# 不复制任何字面量——一个枚举的名字↔值全仓仍然只有一份实现。
[[enum]]
name        = "VkCullModeFlagBits"
fq          = "::VkCullModeFlagBits"
extern_from = "hgl::graph::mtl::ParseVkCullMode"
extern_to   = "hgl::graph::mtl::GetVkCullModeName"
# `VkCullModeFlags` 只是 `uint32_t` 的 typedef，若直接拿它挂 EnumTraits 会退化
# 成 `EnumTraits<uint32_t>` 特化、误伤所有 uint32 字段；所以这里用真正的枚举
# `VkCullModeFlagBits`，转发时经中转型换到拼写表要求的 `VkCullModeFlags`。
extern_mediator = "::VkCullModeFlags"
extern_include  = "hgl/mtl/VkEnumText.h"

[[enum]]
name        = "VkCompareOp"
fq          = "::VkCompareOp"
extern_from = "hgl::graph::mtl::ParseVkCompareOp"
extern_to   = "hgl::graph::mtl::GetVkCompareOpName"
extern_include = "hgl/mtl/VkEnumText.h"

[[enum]]
name        = "VkBlendFactor"
fq          = "::VkBlendFactor"
extern_from = "hgl::graph::mtl::ParseVkBlendFactor"
extern_to   = "hgl::graph::mtl::GetVkBlendFactorName"
extern_include = "hgl/mtl/VkEnumText.h"

# ── 引擎侧枚举：真源是枚举定义旁的 `HGL_ENUM_BEGIN` 登记块 ───────────────────
# `enum_meta = true` 表示「名字↔值真源 = `hgl::serialize::EnumMeta` 登记块」：
# 生成器**不生成**任何 `AssetEnumName_*` / `AssetEnumParse_*` 转发，也不生成
# `EnumTraits` 特化（`Traits.h` 的缺省模板已直达 `EnumMeta<T>`）。
# `extern_include` 只用来让生成的 Meta.gen.h 能看见那个登记块。
[[enum]]
name           = "MaterialDomain"
fq             = "hgl::graph::mtl::MaterialDomain"
extern_from    = "hgl::graph::mtl::ParseMaterialDomain"
extern_to      = "hgl::graph::mtl::GetMaterialDomainName"
extern_include = "hgl/mtl/MaterialDomain.h"

[[enum]]
name           = "VertexInputMode"
fq             = "hgl::graph::mtl::VertexInputMode"
enum_meta      = true
extern_include = "hgl/mtl/VertexShaderNodeConfig.h"

[[enum]]
name           = "PositionMappingMode"
fq             = "hgl::graph::mtl::PositionMappingMode"
enum_meta      = true
extern_include = "hgl/mtl/VertexShaderNodeConfig.h"

[[enum]]
name           = "OrientationMode"
fq             = "hgl::graph::mtl::OrientationMode"
enum_meta      = true
extern_include = "hgl/mtl/VertexShaderNodeConfig.h"

[[enum]]
name           = "ScaleMode"
fq             = "hgl::graph::mtl::ScaleMode"
enum_meta      = true
extern_include = "hgl/mtl/VertexShaderNodeConfig.h"

[[enum]]
name           = "ProjectionMode"
fq             = "hgl::graph::mtl::ProjectionMode"
enum_meta      = true
extern_include = "hgl/mtl/VertexShaderNodeConfig.h"

# `PrimitiveType` 的拼写表（`points` / `line_strip` / `triangle_strip` …）已经是
# `PrimitiveType.h` 里的 `PrimitiveTypeName[]`，而且被 GLSL 与诊断日志共用。
# 若让生成器按 C++ 枚举名自动造表，得到的是 `LineStrip`，与 TOML 契约不一致
# （`stricmp` 能救 `triangles`，救不了 `line_strip`），所以这里只转发。
[[enum]]
name           = "PrimitiveType"
fq             = "hgl::graph::PrimitiveType"
extern_from    = "hgl::graph::ParsePrimitiveTypeName"
extern_to      = "hgl::graph::GetPrimitiveTypeName"
extern_include = "hgl/common/PrimitiveType.h"

# `PrimitiveVariantPurpose` 的 TOML 拼写是蛇形（`depth_only` / `shadow_caster`），
# 名字↔值真源在 `PrimitiveAssetSpec.h` 末尾的 `HGL_ENUM_BEGIN` 登记块。
[[enum]]
name           = "PrimitiveVariantPurpose"
fq             = "hgl::graph::PrimitiveVariantPurpose"
enum_meta      = true
extern_include = "hgl/graph/asset/PrimitiveAssetSpec.h"

# `GeometryAssetSpec` 的三个枚举拼写同样不是 C++ 枚举名（`builtin` / `plane_grid`
# / `v2un8`），法线格式还要兼容历史的 `VF_` 宏名与 Vulkan 原名 —— 全部写在
# `GeometryAssetSpec.h` 末尾的 `HGL_ENUM_BEGIN` 登记块（`ITEM_NAME` / `ITEM_ALIAS`）里。
[[enum]]
name           = "GeometryAssetKind"
fq             = "hgl::graph::GeometryAssetKind"
enum_meta      = true
extern_include = "hgl/graph/asset/GeometryAssetSpec.h"

[[enum]]
name           = "BuiltinShapeKind"
fq             = "hgl::graph::BuiltinShapeKind"
enum_meta      = true
extern_include = "hgl/graph/asset/GeometryAssetSpec.h"

[[enum]]
name           = "VertexNormalFormat"
fq             = "hgl::graph::VertexNormalFormat"
enum_meta      = true
extern_include = "hgl/graph/asset/GeometryAssetSpec.h"

# `NTBType` 的登记块在 `InlineGeometry.h`（`GeometryAssetSpec.h` 已传递包含）。
[[enum]]
name           = "NTBType"
fq             = "hgl::graph::NTBType"
enum_meta      = true
extern_include = "hgl/graph/geo/InlineGeometry.h"

# 全局 SSBO 池类型：名字表在 `GlobalSSBOTypes.h` 末尾的登记块，
# 与末尾的项数 `static_assert` 共用同一份真源。
[[enum]]
name           = "GlobalSSBOType"
fq             = "hgl::graph::GlobalSSBOType"
enum_meta      = true
extern_include = "hgl/graph/ssbo/GlobalSSBOTypes.h"

# 天空模式与 LDR 策略：定义在 `EnvironmentAssetSpec.h`（环境资产规约的真源），
# 拼写表由生成器按别名表构造 —— 这两个枚举同时被 `SkyEnvironmentConfig.h` 转出到
# `hgl::ecs`，全仓仍然只有一份定义。
[[enum]]
name = "SkyMode"
aliases = ["atmosphere", "cubemap_ibl", "octahedral_ibl", "lambert_dome", "sh9_only", "none"]

[[enum]]
name = "SkyAmbientLDR"
aliases = ["auto", "off", "on"]

# ── 几何资产：内置几何体参数 ────────────────────────────────────────────────
[group.Geometry]
namespace     = "hgl::graph"
scan          = ["inc/hgl/graph/asset/GeometryAssetSpec.h"]
serialize     = "inc/hgl/asset/generated/GeometrySerialize.gen.h"
meta          = "inc/hgl/asset/generated/GeometryMeta.gen.h"

# ── 图元资产：几何 + 材质配方的绑定层 ──────────────────────────────────────
[group.Primitive]
namespace     = "hgl::graph"
scan          = ["inc/hgl/graph/asset/PrimitiveAssetSpec.h"]
serialize     = "inc/hgl/asset/generated/PrimitiveSerialize.gen.h"
meta          = "inc/hgl/asset/generated/PrimitiveMeta.gen.h"

# ── 场景编排规约 ────────────────────────────────────────────────────────────
[group.Scene]
namespace     = "hgl::graph"
scan          = ["inc/hgl/graph/asset/SceneAssetSpec.h"]
serialize     = "inc/hgl/asset/generated/SceneSerialize.gen.h"
meta          = "inc/hgl/asset/generated/SceneMeta.gen.h"

# ── 材质配方规约 ────────────────────────────────────────────────────────────
# `ShaderLibrary/asset/recipe/**/*.recipe.toml` 的字段契约真源。跨字段业务校验
# （schema 版本、领域是否已实现、surface_module_name 的适用范围、纹理名合法性）
# 不属于「字段规约」，仍由 MaterialRecipeFile.cpp 承担。
[group.MaterialRecipe]
namespace     = "hgl::graph::mtl"
scan          = ["inc/hgl/graph/asset/MaterialRecipeSpec.h"]
serialize     = "inc/hgl/asset/generated/MaterialRecipeSerialize.gen.h"
meta          = "inc/hgl/asset/generated/MaterialRecipeMeta.gen.h"

# ── 材质数据块规约 ──────────────────────────────────────────────────────────
# `*.material_data.toml` 的字段契约真源：批量 SSBO 材质行（PBR 网格、自发光一组
# 等）从「示例里的双重循环」搬进可授权文件。跨字段业务校验（schema 版本、target
# 必须是内容行类型、本 target 用不到的键必须报错、行数上限）仍由
# `src/ShaderMaterialData/MaterialDataBlockFile.cpp` 承担。
[group.MaterialDataBlock]
namespace     = "hgl::graph"
scan          = ["inc/hgl/graph/asset/MaterialDataBlockSpec.h"]
serialize     = "inc/hgl/asset/generated/MaterialDataBlockSerialize.gen.h"
meta          = "inc/hgl/asset/generated/MaterialDataBlockMeta.gen.h"

# ── 环境资产规约 ────────────────────────────────────────────────────────────
# `*.env.toml` 的字段契约真源：把「画什么天 + 用什么天光」从示例里的硬编码搬进
# 可授权文件。跨字段业务规则（schema 版本、`sh9.bands` 必须正好 9 条、只在
# `auto_generate == false` 时有意义、贴图后缀与 mode 的匹配）仍由解析层承担。
[group.Environment]
namespace     = "hgl::graph"
scan          = ["inc/hgl/graph/asset/EnvironmentAssetSpec.h"]
serialize     = "inc/hgl/asset/generated/EnvironmentSerialize.gen.h"
meta          = "inc/hgl/asset/generated/EnvironmentMeta.gen.h"

# ── 着色器缓存清单的磁盘载荷 ────────────────────────────────────────────────
# `*.pmf`（program manifest）与 `*.cmf`（compute manifest）的载荷形状真源。
# 这里编的是「语义键 → SPV 定位」的查表数据，不是场景资产：外层仍由
# ShaderArtifactFileHeader 的 magic/kind/校验和包帧，载荷本体走 FlatBuffers 后端。
# 类本身（私有成员 + 派生校验 IsValid/IsConsistent/Upsert 不变量）不注解，
# 注解的只有载荷结构与条目结构。
[group.ShaderCache]
namespace     = "hgl::graph::mtl"
scan          = [ "inc/hgl/mtl/ShaderStageKey.h",
                  "inc/hgl/mtl/ShaderLinkSpec.h",
                  "inc/hgl/mtl/ShaderArtifactContract.h",
                  "inc/hgl/mtl/ShaderProgramManifest.h",
                  "inc/hgl/mtl/ShaderComputeProgramManifest.h" ]
serialize     = "inc/hgl/asset/generated/ShaderCacheSerialize.gen.h"
meta          = "inc/hgl/asset/generated/ShaderCacheMeta.gen.h"

# ── Sampler 预设库文本契约 ──────────────────────────────────────────────────
# `ShaderLibrary/contract/sampler.toml` 的字段规约真源。独立分组（不并入
# ShaderCache）：SamplerPreset.h 包含 vulkan.h，生成的序列化头会直接 include
# 被扫描头，独立成组可把 Vulkan 依赖限制在 SamplerPreset.cpp 的编译链里。
# 跨字段业务校验（schema 版本、name 非空且唯一、枚举拼写合法性）仍由解析层承担。
[group.SamplerPreset]
namespace     = "hgl::graph::mtl"
scan          = ["inc/hgl/mtl/SamplerPreset.h"]
serialize     = "inc/hgl/asset/generated/SamplerPresetSerialize.gen.h"
meta          = "inc/hgl/asset/generated/SamplerPresetMeta.gen.h"
