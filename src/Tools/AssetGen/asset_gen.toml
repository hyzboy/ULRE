# AssetGen 配置 —— 只登记「分组与产物位置」，绝不描述字段/布局。
#
# 字段清单、类型、顺序、偏移、类内缺省值全部由 Clang AST 与记录布局推导；
# 这里唯一的人工信息是「输出到哪个文件、属于哪个命名空间」。
#
# `scan` 的每一项可以是**目录**（递归扫描）也可以是**单个头文件**。按文件切分
# 是为了让同一个目录里的不同资产规约落到不同分组，生成文件不至于混在一起。

# 外部定义的枚举（来自第三方头，例如 Vulkan）。按整数序列化，不生成名字表。
integer_enums = ["VkFormat"]

# ── 枚举的 TOML 拼写别名（可选）─────────────────────────────────────────────
# 按**枚举值声明顺序**给出别名：解析时别名与 C++ 名都接受（大小写不敏感），
# 写出时优先用别名。这样既不改动已有的 TOML 拼写，也不用修改 C++ 命名。
[[enum]]
name = "PrimitiveVariantPurpose"
aliases = ["surface", "depth_only", "shadow_caster", "picking", "debug"]

[[enum]]
name = "NTBType"
aliases = ["none", "normal", "normal_tangent", "normal_tangent_bitangent"]

[[enum]]
name = "SceneMaterialType"
aliases = ["PBRSurface", "EmissiveSurface", "TransmissionSurface"]

[[enum]]
name = "SceneCameraMode"
aliases = ["view_model", "free", "look_at", "first_person"]

# ── 外部枚举：拼写表已有唯一真源，生成器只转发 ──────────────────────────────
# Vulkan 三枚举的名字↔值真源是 `inc/hgl/mtl/VkEnumText.h`（去前缀 CamelCase、
# 精确匹配）。材质 TOML 的历史拼写完全由那张表决定，所以这里只声明「去哪转发」，
# 不复制任何字面量——一个枚举的名字↔值全仓仍然只有一份实现。
[[enum]]
name        = "VkCullModeFlags"
fq          = "::VkCullModeFlags"
extern_from = "hgl::graph::mtl::ParseVkCullMode"
extern_to   = "hgl::graph::mtl::GetVkCullModeName"

[[enum]]
name        = "VkCompareOp"
fq          = "::VkCompareOp"
extern_from = "hgl::graph::mtl::ParseVkCompareOp"
extern_to   = "hgl::graph::mtl::GetVkCompareOpName"

[[enum]]
name        = "VkBlendFactor"
fq          = "::VkBlendFactor"
extern_from = "hgl::graph::mtl::ParseVkBlendFactor"
extern_to   = "hgl::graph::mtl::GetVkBlendFactorName"

# ── 几何资产：内置几何体参数 ────────────────────────────────────────────────
[group.Geometry]
namespace     = "hgl::graph"
scan          = ["inc/hgl/graph/asset/GeometryAssetSpec.h"]
serialize     = "inc/hgl/asset/generated/GeometrySerialize.gen.h"
meta          = "inc/hgl/asset/generated/GeometryMeta.gen.h"
fbs_namespace = "hgl.asset.schema"
fbs           = "inc/hgl/asset/generated/geometry_schema.fbs"
fbs_generated = "inc/hgl/asset/generated/geometry_schema_generated.h"
codec         = "inc/hgl/asset/generated/GeometryCodec.gen.h"

# ── 图元资产：几何 + 材质配方的绑定层 ──────────────────────────────────────
[group.Primitive]
namespace     = "hgl::graph"
scan          = ["inc/hgl/graph/asset/PrimitiveAssetSpec.h"]
serialize     = "inc/hgl/asset/generated/PrimitiveSerialize.gen.h"
meta          = "inc/hgl/asset/generated/PrimitiveMeta.gen.h"
fbs_namespace = "hgl.asset.schema"
fbs           = "inc/hgl/asset/generated/primitive_schema.fbs"
fbs_generated = "inc/hgl/asset/generated/primitive_schema_generated.h"
codec         = "inc/hgl/asset/generated/PrimitiveCodec.gen.h"

# ── 场景编排规约 ────────────────────────────────────────────────────────────
[group.Scene]
namespace     = "hgl::graph"
scan          = ["inc/hgl/graph/asset/SceneAssetSpec.h"]
serialize     = "inc/hgl/asset/generated/SceneSerialize.gen.h"
meta          = "inc/hgl/asset/generated/SceneMeta.gen.h"
fbs_namespace = "hgl.asset.schema"
fbs           = "inc/hgl/asset/generated/scene_schema.fbs"
fbs_generated = "inc/hgl/asset/generated/scene_schema_generated.h"
codec         = "inc/hgl/asset/generated/SceneCodec.gen.h"

# ── 材质配方规约 ────────────────────────────────────────────────────────────
# `ShaderLibrary/asset/recipe/**/*.recipe.toml` 的字段契约真源。跨字段业务校验
# （schema 版本、领域是否已实现、surface_module_name 的适用范围、纹理名合法性）
# 不属于「字段规约」，仍由 MaterialRecipeFile.cpp 承担。
[group.MaterialRecipe]
namespace     = "hgl::graph::mtl"
scan          = ["inc/hgl/graph/asset/MaterialRecipeSpec.h"]
serialize     = "inc/hgl/asset/generated/MaterialRecipeSerialize.gen.h"
meta          = "inc/hgl/asset/generated/MaterialRecipeMeta.gen.h"
fbs_namespace = "hgl.asset.schema"
fbs           = "inc/hgl/asset/generated/material_recipe_schema.fbs"
fbs_generated = "inc/hgl/asset/generated/material_recipe_schema_generated.h"
codec         = "inc/hgl/asset/generated/MaterialRecipeCodec.gen.h"
