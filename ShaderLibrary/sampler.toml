# sampler.toml — 全局 Sampler 预设注册表（统一注册机制）
#
# 单一 array-of-tables，出现顺序即索引（从 0 开始），不写 index 字段。
# 全链路以名字为键：material.toml 的 [resources].samplers 引用名字，
# ShaderGen 生成 "#define <name>Sampler <idx>u" 宏，运行时按序 vkCreateSampler。
#
# 约定：
#   * GetIndex(name) 查不到时保底返回 0（Nearest）。
#   * 特殊 sampler（如 Terrain）可通过 RebuildSampler 运行时重建，宏/索引不变。
#   * max_lod 统一 15.0（不再按纹理 mip 级数派生）。
#
# 字段：
#   name          : 预设名（必须为合法 GLSL 标识符，作为宏名）
#   mag_filter    : Nearest | Linear         （默认 Linear）
#   min_filter    : Nearest | Linear         （默认 Linear）
#   mipmap_mode   : Nearest | Linear         （默认 Linear）
#   address_mode  : Repeat | MirroredRepeat | ClampToEdge | ClampToBorder | MirrorClampToEdge（默认 Repeat）
#   anisotropy    : true/false               （默认 false）
#   max_anisotropy: 浮点                     （仅 anisotropy=true 时生效，默认 16.0）
#   max_lod       : 浮点                     （默认 15.0）
#   compare_op    : Never|Less|Equal|LessOrEqual|Greater|NotEqual|GreaterOrEqual|Always（默认关闭比较）

schema = 1

[[samplers]]
name = "Nearest"
mag_filter = "Nearest"
min_filter = "Nearest"
mipmap_mode = "Nearest"

[[samplers]]
name = "Linear"
mag_filter = "Linear"
min_filter = "Linear"
mipmap_mode = "Nearest"

[[samplers]]
name = "Trilinear"
mag_filter = "Linear"
min_filter = "Linear"
mipmap_mode = "Linear"

[[samplers]]
name = "TrilinearAniso"
mag_filter = "Linear"
min_filter = "Linear"
mipmap_mode = "Linear"
anisotropy = true
max_anisotropy = 16.0

[[samplers]]
name = "ShadowPCF"
mag_filter = "Linear"
min_filter = "Linear"
mipmap_mode = "Linear"
address_mode = "ClampToEdge"
compare_op = "LessOrEqual"

[[samplers]]
name = "Terrain"
mag_filter = "Linear"
min_filter = "Linear"
mipmap_mode = "Linear"
anisotropy = true
max_anisotropy = 8.0

[[samplers]]
name = "UI"
mag_filter = "Linear"
min_filter = "Linear"
mipmap_mode = "Linear"
address_mode = "ClampToEdge"

# 深度/阴影贴图专用。
#
# 必须是 Nearest：VK_FORMAT_D32_SFLOAT 这类纯深度格式**不支持**
# VK_FORMAT_FEATURE_SAMPLED_IMAGE_FILTER_LINEAR_BIT，用 Linear 采样是
# 未定义行为（AMD 上稳定返回 0），会让"基准值 == 采样值"恒成立、阴影永不出现。
# 滤波/PCF 由 shader 自己做多次 Nearest 取样实现（见 material/shadow_receiver_source.glsl）。
#
# ClampToEdge 而非 Repeat：阴影贴图的 uv 恰好铺满 [0,1]，但 PCF 的 ±1 邻域
# 会越界，Repeat 会把对侧边缘的几何卷回来。
#
# 注意：本项**追加在末尾**（索引 7）。sampler 索引 = 出现顺序，
# 插在中间会让所有已编译 shader 里的 #define <name>Sampler <idx>u 错位。
[[samplers]]
name = "ShadowMap"
mag_filter = "Nearest"
min_filter = "Nearest"
mipmap_mode = "Nearest"
address_mode = "ClampToEdge"
