schema = 2
id = "VertexPaletteColor"
name = "VertexPaletteColor"
source = "file"
bootstrap = "None"
provider_policy = "GeometryOnly"

[pipeline]
family = "forward_unlit"
profiles = ["vertex_color"]
default_profile = "vertex_color"

[transform]
source = "Vec3Position"
mapping = "Passthrough3D"
orientation = "World"
scale = "World"
projection = "WorldCameraVP"

[fragment]
source = "forward_surface"
surface_module = "surface/material_surface.glsl"
material_source_module = "material/vertex_color_source.glsl"

[compositor]
surface = "Unlit"
blend = "Opaque"
pass = "ForwardOpaque"

[vertex]
requirements = ["Position", "Color", "TransformID", "Size"]
varyings = ["use_transform_id_attr", "emit_vertex_color_from_palette"]

[resources]
ubos = ["CameraInfo", "MaterialColorPalette"]
