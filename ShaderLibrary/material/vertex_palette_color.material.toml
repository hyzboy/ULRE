schema = 1
id = "VertexPaletteColor"
name = "VertexPaletteColor"
source = "file"
usage = "General"
bootstrap = "None"
provider_policy = "GeometryOnly"

[transform]
source = "Vec3Position"
mapping = "Passthrough3D"
orientation = "World"
scale = "World"
projection = "WorldCameraVP"
transport = "ssbo"

[fragment]
source = "compositor/main_forward_surface.frag.glsl"
surface_module = "surface/material_surface.glsl"
material_source_module = "material/vertex_color_source.glsl"

[compositor]
surface = "Unlit"
blend = "Opaque"
pass = "ForwardOpaque"

[vertex]
requirements = ["Position", "Color", "TransformID"]
varyings = ["use_transform_id_attr", "emit_vertex_color_from_palette"]

[resources]
ubos = ["ViewportInfo", "CameraInfo", "MaterialColorPalette"]
