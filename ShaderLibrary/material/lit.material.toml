schema = 2
id = "Lit"
name = "Lit"
source = "file"
bootstrap = "None"
provider_policy = "GeometryOnly"

[transform]
source = "Vec3Position"
mapping = "Passthrough3D"
orientation = "World"
scale = "World"
projection = "WorldCameraVP"

[fragment]
material_source_module = "material/pbr_surface_source.glsl"
ntb_module = "ntb/ntb_tangent_vbo_normalmap.glsl"

[vertex]
requirements = ["Position", "UV0", "Normal"]
varyings = ["emit_data_index_id", "emit_world_pos", "emit_world_normal", "emit_uv0"]

[resources]
ubos = ["CameraInfo", "SkyInfo"]
samplers = ["Trilinear", "Linear"]
