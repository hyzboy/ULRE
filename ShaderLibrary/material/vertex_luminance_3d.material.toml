schema = 1
id = "VertexLuminance3D"
name = "VertexLuminance3D"
source = "file"
usage = "General"
bootstrap = "None"
program_mode = "Compositor"
provider_policy = "GeometryOnly"

[transform]
source = "Vec3Position"
mapping = "Passthrough3D"
orientation = "World"
scale = "World"
projection = "WorldCameraVP"

[compositor]
surface = "Unlit"
blend = "Opaque"
pass = "ForwardOpaque"
fragment = "compositor/main_forward_unlit_luminance.frag.glsl"
surface_module = "surface/unlit_luminance_surface.glsl"

[vertex]
requirements = ["Position", "Luminance"]
varyings = ["emit_data_index_id", "emit_texture_layer_id", "texture_layer_id_uses_data_index", "emit_luminance"]

[resources]
ubos = ["ViewportInfo", "CameraInfo"]
ssbos = [{ name = "mtl", type = "EmissiveSurface" }]
