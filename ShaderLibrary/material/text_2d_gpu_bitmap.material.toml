schema = 2
id = "builtin/text_gpu_bitmap"
name = "Text2D_GPU_Bitmap"
source = "file"
bootstrap = "TextAlphaBlend"
provider_policy = "GeometryOnly"

[pipeline]
family = "forward_unlit"
profiles = ["texture"]
default_profile = "texture"

[transform]
source = "None"
mapping = "PixelToLocal"
orientation = "World"
scale = "World"
projection = "OrthoViewport"

[fragment]
source = "forward_surface"
surface_module = "surface/material_surface.glsl"
material_source_module = "material/text_source_gpu.glsl"

[compositor]
surface = "Unlit"
blend = "Transparent"
pass = "ForwardTransparent"

[vertex]
requirements = ["Position", "UV0"]
varyings = ["emit_data_index_id", "emit_uv0", "emit_vertex_color"]

[mesh_shader]
mode = "CharQuad"

[resources]
samplers = ["Nearest"]
