schema = 2
id = "builtin/text_gpu_bitmap"
name = "Text2D_GPU_Bitmap"
source = "file"
bootstrap = "TextAlphaBlend"
provider_policy = "GeometryOnly"

[transform]
source = "None"
mapping = "PixelToLocal"
orientation = "World"
scale = "World"
projection = "OrthoViewport"

[fragment]
material_source_module = "material/text_source_gpu.glsl"

[render_state]
pipeline = { alpha_blend = true }

[vertex]
requirements = ["Position", "UV0"]
varyings = ["emit_data_index_id", "emit_uv0", "emit_vertex_color"]

[mesh_shader]
mode = "CharQuad"

[resources]
material_data = { type = "TextureLayer" }
samplers = ["Nearest"]
