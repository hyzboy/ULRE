schema = 4
id = "builtin/text_gpu_bitmap"
name = "Text2D_GPU_Bitmap"
provider_policy = "GeometryOnly"

# 领域由此键完整决定：顶点语义要求、表面来源模块、
# 纹理槽白名单全部由领域契约给出，资产只填领域 + 数值 + 图。
domain = "Text2D"

[transform]
source = "None"
mapping = "PixelToLocal"
orientation = "World"
scale = "World"
projection = "OrthoViewport"

[fragment]
# 表面来源模块由领域契约给出，不再重复声明。

[render_state]
pipeline = { alpha_blend = true }

[vertex]
requirements = ["Position", "UV0"]
varyings = ["emit_data_index_id", "emit_uv0", "emit_vertex_color"]

[mesh_shader]
mode = "CharQuad"

[resources]
textures = [{ name = "base_color", sampler = "Sampler2DArray", required = true }]
samplers = ["Nearest"]
