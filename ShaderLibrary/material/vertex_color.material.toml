schema = 4
id = "VertexColor"
name = "VertexColor"
provider_policy = "GeometryOnly"

# 领域由此键完整决定：顶点语义要求、表面来源模块、
# 纹理槽白名单全部由领域契约给出，资产只填领域 + 数值 + 图。
domain = "VertexColor"

[transform]
source = "Vec3Position"
mapping = "Passthrough3D"
orientation = "World"
scale = "World"
projection = "WorldCameraVP"

[fragment]
# 表面来源模块由领域契约给出，不再重复声明。

[vertex]
requirements = ["Position", "Color"]
varyings = ["emit_vertex_color"]

[resources]
