schema = 1
id = "builtin/text_gpu"
name = "Text2D_GPU"
source = "file"
bootstrap = "TextAlphaBlend"
provider_policy = "GeometryOnly"

[transform]
source = "None"
mapping = "PixelToLocal"
orientation = "World"
scale = "World"
projection = "OrthoViewport"

[fragment]
source = "compositor/main_forward_surface.frag.glsl"
surface_module = "surface/material_surface.glsl"
material_source_module = "material/text_source_gpu.glsl"

[compositor]
surface = "Unlit"
blend = "Transparent"
pass = "ForwardTransparent"

[vertex]
requirements = ["Position", "UV0"]
varyings = ["emit_data_index_id", "emit_uv0", "emit_vertex_color", "emit_style_id"]

[mesh_shader]
mode = "CharQuad"

[resources]
samplers = ["Linear"]
defines = ["TEXT_SDF_ENABLED"]
