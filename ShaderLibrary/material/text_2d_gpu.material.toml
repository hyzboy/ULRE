schema = 4
id = "builtin/text_gpu"
name = "Text2D_GPU"
provider_policy = "GeometryOnly"

# 领域由此键完整决定：顶点语义要求、表面来源模块、
# 纹理槽白名单全部由领域契约给出，资产只填领域 + 数值 + 图。
domain = "Text2D"

[fragment]
# 表面来源模块由领域契约给出，不再重复声明。

[render_state]
pipeline = { alpha_blend = true }

[vertex]
requirements = ["Position", "UV0"]
varyings = ["emit_data_index_id", "emit_uv0", "emit_vertex_color", "emit_style_id"]

[mesh_shader]
mode = "CharQuad"

[resources]
# 槽形态由领域 Text2D 的契约给出（Sampler2DArray / 必绑）。
# 过滤设置仍留在资产上：SDF 用 Linear、位图用 Nearest，本来就该按资产不同。
textures = [{ name = "base_color" }]
samplers = ["Linear"]
defines = ["TEXT_SDF_ENABLED"]
