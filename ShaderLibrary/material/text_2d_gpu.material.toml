schema = 2
id = "builtin/text_gpu"
name = "Text2D_GPU"
source = "file"
bootstrap = "TextAlphaBlend"
provider_policy = "GeometryOnly"

[pipeline]
family = "forward_unlit"
profiles = ["texture"]
default_profile = "texture"

[transform]
source = "None"
mapping = "PixelToLocal"
orientation = "World"
scale = "World"
projection = "OrthoViewport"

[fragment]
material_source_module = "material/text_source_gpu.glsl"

[render_state]
pipeline = { alpha_blend = true }

[vertex]
requirements = ["Position", "UV0"]
varyings = ["emit_data_index_id", "emit_uv0", "emit_vertex_color", "emit_style_id"]

[mesh_shader]
mode = "CharQuad"

[resources]
samplers = ["Linear"]
defines = ["TEXT_SDF_ENABLED"]
