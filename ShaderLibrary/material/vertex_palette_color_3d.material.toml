schema = 1
id = "VertexPattleColor3D"
name = "VertexPattleColor3D"
source = "file"
usage = "General"
bootstrap = "None"
domain = "World3D"
program_mode = "Compositor"
provider_policy = "GeometryOnly"

[compositor]
surface = "Unlit"
blend = "Opaque"
pass = "ForwardOpaque"
fragment = "compositor/main_forward_unlit_vertexcolor.frag.glsl"
surface_module = "surface/unlit_vertexcolor_surface.glsl"

[vertex]
requirements = ["Position", "Color", "TransformID"]
varyings = ["use_transform_id_attr", "emit_vertex_color_from_pattle"]

[resources]
ubos = ["ViewportInfo", "CameraInfo", "MaterialColorPalette"]
