schema = 2
id = "SkyMinimal"
name = "SkyMinimal"
source = "file"
bootstrap = "None"
provider_policy = "GeometryOnly"

[pipeline]
family = "sky"
profiles = ["constant"]
default_profile = "constant"

[transform]
source = "Vec3Position"
mapping = "Passthrough3D"
orientation = "World"
scale = "World"
projection = "WorldCameraVP"

[fragment]
source = "forward_sky"
surface_module = "surface/sky_minimal_surface.glsl"

[compositor]
surface = "Sky"
blend = "Opaque"
pass = "ForwardOpaque"

[vertex]
requirements = ["Position"]
varyings = ["emit_frag_direction"]

[resources]
ubos = ["CameraInfo", "SkyInfo"]
