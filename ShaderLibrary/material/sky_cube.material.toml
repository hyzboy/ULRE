schema = 4
id = "SkyCube"
name = "SkyCube"
provider_policy = "GeometryOnly"

# 领域由此键完整决定：顶点语义要求、表面来源模块、
# 纹理槽白名单全部由领域契约给出，资产只填领域 + 数值 + 图。
domain = "Sky"

[fragment]
surface_module_name = "sky_cube_surface"

[vertex]
requirements = ["Position"]
varyings = ["emit_frag_direction", "emit_data_index_id"]

[resources]
# 槽形态由领域 Sky 的契约给出（SamplerCube / 必绑）。
textures = [{ name = "sky_cube" }]
samplers = ["Trilinear"]
