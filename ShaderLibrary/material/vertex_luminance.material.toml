schema = 2
id = "VertexLuminance"
name = "VertexLuminance"
source = "file"
bootstrap = "None"
provider_policy = "GeometryOnly"

[pipeline]
family = "forward_unlit"
profiles = ["vertex_color"]
default_profile = "vertex_color"

[transform]
source = "Vec3Position"
mapping = "Passthrough3D"
orientation = "World"
scale = "World"
projection = "WorldCameraVP"

[fragment]
source = "forward_surface"
surface_module = "surface/material_surface.glsl"
material_source_module = "material/luminance_source.glsl"

[compositor]
surface = "Unlit"
blend = "Opaque"
pass = "ForwardOpaque"

[vertex]
requirements = ["Position", "Luminance"]
varyings = ["emit_data_index_id", "emit_luminance"]

[resources]
ubos = ["CameraInfo"]
material_data = { type = "EmissiveSurface" }
