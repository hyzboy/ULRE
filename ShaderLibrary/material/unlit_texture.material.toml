schema = 4
id = "UnlitTexture"
name = "UnlitTexture"
provider_policy = "GeometryOnly"

# 领域由此键完整决定：顶点语义要求、表面来源模块、
# 纹理槽白名单全部由领域契约给出，资产只填领域 + 数值 + 图。
domain = "UnlitTexture"

[fragment]
# 表面来源模块由领域契约给出，不再重复声明。

[vertex]
requirements = ["Position", "UV0"]
varyings = ["emit_data_index_id", "emit_uv0"]

[resources]
textures = [{ name = "base_color", sampler = "Sampler2DArray", required = true }]
samplers = ["Trilinear"]
