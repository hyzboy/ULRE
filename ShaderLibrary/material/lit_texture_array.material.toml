schema = 1
id = "LitTextureArray"
name = "LitTextureArray"
source = "file"
usage = "General"
bootstrap = "None"
program_mode = "Compositor"
provider_policy = "GeometryOnly"

[transform]
source = "Vec3Position"
mapping = "Passthrough3D"
orientation = "World"
scale = "World"
projection = "WorldCameraVP"

[compositor]
surface = "Standard"
blend = "Opaque"
pass = "ForwardOpaque"
fragment = "compositor/main_forward_lit.frag.glsl"
surface_module = "surface/standard_texturearray_surface.glsl"

[vertex]
requirements = ["Position", "UV0", "Normal"]
varyings = ["emit_data_index_id", "emit_texture_layer_id", "texture_layer_id_uses_data_index", "emit_world_pos", "emit_world_normal", "emit_uv0"]

[resources]
ubos = ["ViewportInfo", "CameraInfo", "SkyInfo"]
code_modules = ["SkyLightHeader", "PBRSurface"]
ssbos = [{ name = "mtl", type = "PBRSurface" }]
textures = [
  { slot = "BaseColor", sampler = "Sampler2DArray", required = false },
  { slot = "Normal", sampler = "Sampler2DArray", required = false },
  { slot = "Metallic", sampler = "Sampler2DArray", required = false },
  { slot = "Roughness", sampler = "Sampler2DArray", required = false },
  { slot = "Occlusion", sampler = "Sampler2DArray", required = false }
]
