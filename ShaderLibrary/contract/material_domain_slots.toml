# ShaderLibrary/contract/material_domain_slots.toml
#
# 材质领域（MaterialDomain）纹理槽规范契约注册表
# ── 单一事实真源（Single Source of Truth）──
#
# 该文件定义所有非 Custom 材质领域的纹理槽规范列表。
# 由 src/Tools/DomainSlotGen/domain_slot_gen.py 工具自动派生：
#   1. C++ 头文件: inc/hgl/mtl/generated/MaterialDomainSlots.gen.h
#   2. GLSL 绑定片段: ShaderLibrary/domain/generated/<domain>_texture_bindings.glsl
#
# 字段说明：
#   domain            : C++ MaterialDomain 枚举名及契约名（如 StandardOpaque, Foliage, UI2D 等）
#   description       : 领域简要说明
#   [[domains.slots]] : 纹理槽列表（顺序严格保持，槽位顺序即 ABI 布局顺序与索引）
#     name            : 纹理槽名（TOML 与 GLSL 标识符，生成 uvec2 tex_<name>）
#     role            : 语义角色（对应 C++ MaterialDomainTextureRole 枚举，如 BaseColor, Normal 等）
#     must_declare    : 材质是否必须在 TOML 中声明此槽（true = 强制声明以保证 layout 统一）
#     sampler         : 默认采样器种类（对应 SamplerType，如 Sampler2DArray, SamplerCube 等）
#     binding_required: 是否在运行时必须绑定实际纹理（true = 缺失直接报错；false = 可缺省并用中性值保底）
#     channels        : 通道数约束（0 = 由纹素格式决定；2 = 双通道法线 XY，如 Normal 槽）

schema = 1

# ══ PBR 表面族 ════════════════════════════════════════════════════════════════

[[domains]]
domain = "StandardOpaque"
description = "通用不透明/半透明硬表面"

[[domains.slots]]
name = "base_color"
role = "BaseColor"
must_declare = true
sampler = "Sampler2DArray"
binding_required = false
channels = 0

[[domains.slots]]
