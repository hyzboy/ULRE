name = "Sky34"
schema = 2
description = "统一天空资产 sky_34：大气/立方体/八面体/Lambert 穹顶/SH9 五档技术并列，画质档在资产外选型"

[visual]
[ambient]
mode = "cubemap_ibl"

[ibl]
[sh9]
auto_generate = true
track_sun = true

[ldr]
[base]
scale = 1.0
track_camera = true

[cubemap]
irradiance = "texcube:pack(res):image/Environments/sky_34_2k/sky_34_cubemap_2k/sky_34_cubemap_2k_irradiance"
recipe = "IBLEnvironment.Sky"
prefilter = "texcube:pack(res):image/Environments/sky_34_2k/sky_34_cubemap_2k/sky_34_cubemap_2k_prefilter"
ldr_exposure_base = 2.5
ldr_mode = "on"
ldr_min_ambient = 0.05
ldr_sun_scale = 1.0

[octahedral]
irradiance = "texoct:pack(res):image/Environments/sky_34_2k/sky_34_cubemap_2k/sky_34_cubemap_2k_irradiance"
recipe = "IBLEnvironmentSkyOct.Sky"
prefilter = "texoct:pack(res):image/Environments/sky_34_2k/sky_34_cubemap_2k/sky_34_cubemap_2k_prefilter"
ldr_exposure_base = 2.5
ldr_mode = "on"
ldr_min_ambient = 0.05
ldr_sun_scale = 1.0

[lambert_dome]
irradiance = "texcube:pack(res):image/Environments/sky_34_2k/sky_34_cubemap_2k/sky_34_cubemap_2k_irradiance"
recipe = "SkyLambertDome.Unlit"
ldr_min_ambient = 0.05
ldr_sun_scale = 1.0
scale = 100.0
prefilter = "texcube:pack(res):image/Environments/sky_34_2k/sky_34_cubemap_2k/sky_34_cubemap_2k_prefilter"
ldr_exposure_base = 2.5
ldr_mode = "on"

[atmosphere]
recipe = "AtmosphereSkyAmbient.Sky"

