# sky_34 立方体贴图：天空球贴 `sky_34_cubemap_2k.TexCube`（由配方的 `material_source`
# 沿同名约定取图），天光走同一批烘焙数据的 Cube 投影展开 —— `.TexCube` 后缀让托管层
# 选到 `ambient_light_ibl`。
#
# `[ldr] mode = "on"`：这批烘焙图是 unorm 量化版（LDR），需要曝光调制才不至于偏黑；
# 换成 HDR 烘焙图时把 mode 改回 `auto` 即可，`auto` 会按装载出来的格式判定。
schema = 1
name = "Sky34.CubeMapIBL"
description = "sky_34 立方体贴图天空 + 同批 IBL 天光（Cube 投影）"

[visual]
recipe = "IBLEnvironment.Sky"
scale = 1.0
track_camera = true

[ambient]
mode = "cubemap_ibl"

[ibl]
irradiance = "res/image/Environments/sky_34_2k/sky_34_cubemap_2k/sky_34_cubemap_2k_irradiance.TexCube"
prefilter = "res/image/Environments/sky_34_2k/sky_34_cubemap_2k/sky_34_cubemap_2k_prefilter.TexCube"

[ldr]
mode = "on"
exposure_base = 2.5
sun_scale = 1.0
min_ambient = 0.05

[sh9]
auto_generate = true
track_sun = true
