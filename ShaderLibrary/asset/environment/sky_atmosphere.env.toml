# 解析大气：天空球用 `AtmosphereSkyAmbient.Sky`（纯解析，不读烘焙图），
# 天光由同一套大气解析式给出。太阳参数由 `EnvironmentSystem` 每帧从主光源灌入。
schema = 1
name = "Sky.Atmosphere"
description = "廉价解析大气（天空 + 天光同源，无烘焙图）"

[visual]
recipe = "AtmosphereSkyAmbient.Sky"
scale = 1.0
track_camera = true

[ambient]
mode = "atmosphere"

[sh9]
auto_generate = true
track_sun = true
