# Lambert 穹顶：几何体是半球穹顶（基准半径 1），UV 按 Lambert Azimuthal 投影
# 烘进顶点，所以必须靠 `scale` 放大到相机之外才能当背景用（全天球模式是半径 256，
# `scale = 1.0` 就够）。天光仍旧走 `.TexCube` 那批烘焙数据 —— 视觉与天光解耦。
schema = 1
name = "Sky34.LambertDome"
description = "sky_34 Lambert 方位等积穹顶天空 + Cube 投影 IBL 天光"

[visual]
recipe = "SkyLambertDome.Unlit"
scale = 100.0
track_camera = true

[ambient]
mode = "lambert_dome"

[ibl]
irradiance = "res/image/Environments/sky_34_2k/sky_34_cubemap_2k/sky_34_cubemap_2k_irradiance.TexCube"
prefilter = "res/image/Environments/sky_34_2k/sky_34_cubemap_2k/sky_34_cubemap_2k_prefilter.TexCube"

[ldr]
mode = "on"
exposure_base = 2.5
sun_scale = 1.0
min_ambient = 0.05

[sh9]
auto_generate = true
track_sun = true
