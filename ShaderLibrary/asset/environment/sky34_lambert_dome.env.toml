name = "Sky34.LambertDome"
schema = 1
description = "sky_34 Lambert 方位等积穹顶天空 + Cube 投影 IBL 天光"

[visual]
recipe = "SkyLambertDome.Unlit"
scale = 100.0
track_camera = true

[ambient]
mode = "lambert_dome"

[ibl]
irradiance = "res/image/Environments/sky_34_2k/sky_34_cubemap_2k/sky_34_cubemap_2k_irradiance.TexCube"
prefilter = "res/image/Environments/sky_34_2k/sky_34_cubemap_2k/sky_34_cubemap_2k_prefilter.TexCube"

[sh9]
auto_generate = true
track_sun = true

[ldr]
mode = "on"
min_ambient = 0.05
sun_scale = 1.0
exposure_base = 2.5

