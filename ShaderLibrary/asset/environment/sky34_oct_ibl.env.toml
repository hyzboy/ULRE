# sky_34 八面体贴图：同一批烘焙数据的 Octahedral 展开（`.TexOct`），
# 天空球用 `IBLEnvironmentSkyOct.Sky` 按方向采样，天光由 `.TexOct` 后缀推到
# `ambient_light_ibl_oct`。除投影形态外与 `Sky34.CubeMapIBL` 完全等价。
schema = 1
name = "Sky34.OctahedralIBL"
description = "sky_34 八面体贴图天空 + 同批 IBL 天光（Octahedral 投影）"

[visual]
recipe = "IBLEnvironmentSkyOct.Sky"
scale = 1.0
track_camera = true

[ambient]
mode = "octahedral_ibl"

[ibl]
irradiance = "res/image/Environments/sky_34_2k/sky_34_cubemap_2k/sky_34_cubemap_2k_irradiance.TexOct"
prefilter = "res/image/Environments/sky_34_2k/sky_34_cubemap_2k/sky_34_cubemap_2k_prefilter.TexOct"

[ldr]
mode = "on"
exposure_base = 2.5
sun_scale = 1.0
min_ambient = 0.05

[sh9]
auto_generate = true
track_sun = true
