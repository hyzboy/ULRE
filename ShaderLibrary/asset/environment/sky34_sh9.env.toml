# 纯球谐天光：天光用 `ambient_light_sh`（9 系数由 `EnvironmentSystem` 按太阳现算，
# 不读任何烘焙图），天空视觉仍旧是 sky_34 的立方体贴图 —— 这正是"天光不必依赖
# 天空贴图"的演示档。几何体显式写出来，是为了和 `Sky34.CubeMapIBL` 区分开
# （同一套视觉配方的另一份装配）。
schema = 1
name = "Sky34.SH9"
description = "sky_34 立方体贴图天空 + SH9 球谐天光（无烘焙图依赖）"

[visual]
recipe = "IBLEnvironment.Sky"
geometry = "geo:builtin:hex_sphere_sky"
scale = 1.0
track_camera = true

[ambient]
mode = "sh9_only"
provider = "ambient_light_sh"

[sh9]
auto_generate = true
track_sun = true
