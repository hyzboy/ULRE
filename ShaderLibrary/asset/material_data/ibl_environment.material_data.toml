# 本文件是示例原先逐行硬编码的材质 SSBO 数据的唯一来源；示例代码只引用
# `mtldata:file:ShaderLibrary/asset/material_data/ibl_environment.material_data.toml`。
# 行序 = 文件内顺序 = 池内行序（块内第 i 行 == 池行号 first + i）。

