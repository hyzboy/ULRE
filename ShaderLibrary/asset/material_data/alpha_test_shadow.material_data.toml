# AlphaTestShadow 示例的材质数据块：单行浅灰、无切线扰动的 PBR（alpha 裁剪用底色由纹理提供）。
#
# 本文件是示例原先逐行硬编码的材质 SSBO 数据的唯一来源；示例代码只引用
# `mtldata:file:ShaderLibrary/asset/material_data/alpha_test_shadow.material_data.toml`。
# 行序 = 文件内顺序 = 池内行序（块内第 i 行 == 池行号 first + i）。

schema = 1
name = "alpha_test_shadow"
target = "PBRSurface"

[[rows]]
base_color = [0.9, 0.9, 0.9, 1.0]
metallic = 0.02
roughness = 0.5
normal_scale = 0.0

