# GLTF_FlightHelmet 示例的材质数据块：6 个 glTF 材质（与 recipe 材质下标一一对应）。
#
# 行序 = material_index = FlightHelmet.gltf materials[] 顺序：
#   0 HoseMat  1 RubberWoodMat  2 GlassPlasticMat  3 MetalPartsMat
#   4 LeatherPartsMat  5 LensesMat
# HoseMat 与 RubberWoodMat 贴图完全相同（共用 GLTF.FlightHelmet.RubberWood 配方），
# 因子也一致，仍按位占行以保证 rows_by_material_index 直选。
#
# metallic/roughness 取 glTF 缺省因子 1.0：实际值由 ORM 贴图通道解包；
# base_color 全为白（六个材质都带 BaseColor 贴图）；normal_scale 取缺省 1.0。

schema = 1
name = "gltf_flight_helmet"
target = "PBRSurface"

[[rows]]
base_color = [1.0, 1.0, 1.0, 1.0]
metallic = 1.0
roughness = 1.0
normal_scale = 1.0

[[rows]]
base_color = [1.0, 1.0, 1.0, 1.0]
metallic = 1.0
roughness = 1.0
normal_scale = 1.0

