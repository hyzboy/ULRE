# PBRMatrix 示例的批量材质数据块（10x10 = 100 行 PBRSurface）
#
# Filament《materials.spheres》矩阵口径：
#   col -> metallic   0.0 -> 1.0（10 档步进 1/9）
#   row -> roughness  0.045 -> 1.0（FILAMENT MIN_PERCEPTUAL_ROUGHNESS 起步）
