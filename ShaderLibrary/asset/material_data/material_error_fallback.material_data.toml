# MaterialErrorFallback 示例的材质数据块：单行暖砂色 PBR（normal_scale 留缺省）。
#
# 本文件是示例原先逐行硬编码的材质 SSBO 数据的唯一来源；示例代码只引用
# `mtldata:file:ShaderLibrary/asset/material_data/material_error_fallback.material_data.toml`。
# 行序 = 文件内顺序 = 池内行序（块内第 i 行 == 池行号 first + i）。

schema = 1
name = "material_error_fallback"
target = "PBRSurface"

[[rows]]
base_color = [0.85, 0.72, 0.45, 1.0]
metallic = 0.05
roughness = 0.85

