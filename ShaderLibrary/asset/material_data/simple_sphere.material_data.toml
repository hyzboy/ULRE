# SimpleSphere 示例的材质数据块：单个白色、低金属高粗糙的 PBR 球。
#
# 本文件是示例原先逐行硬编码的材质 SSBO 数据的唯一来源；示例代码只引用
# `mtldata:file:ShaderLibrary/asset/material_data/simple_sphere.material_data.toml`。
# 行序 = 文件内顺序 = 池内行序（块内第 i 行 == 池行号 first + i）。

schema = 1
name = "simple_sphere"
target = "PBRSurface"

[[rows]]
base_color = [1.0, 1.0, 1.0, 1.0]
metallic = 0.08
roughness = 0.92
normal_scale = 0.35

