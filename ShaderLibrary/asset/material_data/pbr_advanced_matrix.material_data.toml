# PBRAdvanced 示例的批量材质数据块（4 band × 10 = 40 行 PBRAdvancedSurface）
#
# 每 band 沿 col 扫一个高级参数（t = col/9），band 内其余参数恒定：
#   band 0（车漆）   clearcoat         0 → 1（clearcoat_roughness 固定 0.1）
#   band 1（丝绸）   sheen_color 亮度  0 → 1（sheen_roughness 固定 0.3）
#   band 2（拉丝金属）anisotropy       0 → 1（metallic 1.0 / roughness 0.3）
#   band 3（玉石）   subsurface_power  0 → 1（thickness 固定 1.0）
# f0 fresnel 全部走缺省 0.04（Filament reflectance 0.5 等效）。

schema = 1
name = "pbr_advanced_matrix"
target = "PBRAdvancedSurface"

