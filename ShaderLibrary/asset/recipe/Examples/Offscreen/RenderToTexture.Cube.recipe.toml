schema = 1
name = "RenderToTexture.Cube"
domain = "StandardOpaque"

# 底座贴离屏世界的颜色附件：`rt:<RT名>:<附件名>`。句柄由 MaterialRecipeRegistry
# 在配方加载时创建，RenderTargetManager 建 RT 时按名字接上（无排序约定）。
[[textures]]
name = "base_color"
asset = "rt:RenderToTexture:OffscreenRT:color0"

[[textures]]
name = "normal"
asset = "tex2d:pack(res):image/Brickwall/Normal"
auto_mipmaps = true

[[textures]]
name = "roughness"
asset = "tex2d:pack(res):image/Brickwall/Roughness"
auto_mipmaps = true