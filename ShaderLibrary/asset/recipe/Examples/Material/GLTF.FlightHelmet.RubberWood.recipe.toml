# glTF Sample Models: FlightHelmet — RubberWoodMat（HoseMat 共用同一套贴图）。
# 贴图为 GLTFConvert 直出的 ORM 口径（_OcclusionRoughMetal.png：R=AO G=rough B=metal），
# StandardOpaque 原生解包，无需离线重打包。
schema = 1
name = "GLTF.FlightHelmet.RubberWood"
domain = "StandardOpaque"

[[textures]]
name = "base_color"
asset = "res/FlightHelmet.StaticMesh/FlightHelmet.image.2.BaseColor.Tex2D"
auto_mipmaps = true

[[textures]]
name = "normal"
asset = "res/FlightHelmet.StaticMesh/FlightHelmet.image.0.Tex2D"
auto_mipmaps = true

[[textures]]
name = "orm"
asset = "res/FlightHelmet.StaticMesh/FlightHelmet.image.1.MetallicRoughness.Tex2D"
auto_mipmaps = true
