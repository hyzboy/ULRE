schema = 4
id = "lit"

# 材质定义：只填领域 + 资源 + 数值。
# 顶点语义需求（Position/UV0/Normal）、Varying（根据领域契约自动推导）、
# 顶点提供策略、表面来源模块、法线标架模块全部由领域 StandardOpaque 契约给出。
domain = "StandardOpaque"

[resources]
# 槽的形态（采样器种类 / 是否必绑 / 通道数）由领域 StandardOpaque 的契约给出：
# 同一个领域里这三项必然相同，资产重复声明只会制造「同领域不同布局」。
# 资产只需列出要声明的槽名。
textures = [
    { name = "base_color" },
    { name = "roughness" },
    { name = "metallic" },
    { name = "occlusion" },
    { name = "opacity_mask" },
    { name = "normal" }
]
samplers = ["Trilinear", "Linear", "ShadowPCF"]
