schema = 4
id = "unlit_texture_3d"

# 材质定义：只填领域 + 资源 + 数值。
# 与 `unlit_texture` 的唯一区别是领域：那边是 2D NDC 贴面（屏幕矩形），
# 这边是世界空间 3D 几何（Position 经相机投影）。片元阶段的算法完全一致
# ——采样 base_color 后直出，不经任何光照。
#
# 典型用途：把一张中间缓冲（RT 的 color/depth 附件、法线图等）原样贴到
# 世界物体上做可视化，图像不被环境光/高光改写。
domain = "UnlitTexture3D"

[resources]
textures = [{ name = "base_color" }]
samplers = ["Trilinear"]
