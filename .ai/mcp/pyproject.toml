[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ulre-logger-guard"
version = "0.1.0"
description = "MCP server for ULRE logger policy enforcement and scanning"
requires-python = ">=3.9"
dependencies = [
    "mcp>=1.27,<2",
]

[project.scripts]
logger-guard-mcp = "logger_guard_server:main"

[tool.hatch.build.targets.wheel]
packages = ["logger_guard_server.py"]
